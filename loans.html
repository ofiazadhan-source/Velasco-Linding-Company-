<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINDING COOP - Manage Loans (ADMIN)</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f5f5f5;padding:15px}
.header{background:#ff6a00;color:white;padding:15px;border-radius:12px;margin-bottom:15px}
.card{background:white;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-left:5px solid orange}
.card.APPROVED{border-left-color:green}
.card.DECLINED{border-left-color:red}
.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-right:6px}
.btn-approve{background:#16a34a;color:white}
.btn-decline{background:#dc2626;color:white}
.btn-view{background:#2563eb;color:white;width:100%;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;margin:8px 0}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal img{max-width:100%;max-height:90vh;border-radius:12px;background:white;padding:5px}
.modal.show{display:flex}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0">Manage Loans (ADMIN)</h2>
<small>Firebase: casino-plus-game | No Storage - Base64 ID</small><br>
<small id="counts">Loading...</small>
<br><button onclick="location.href='index.html'" style="margin-top:8px;padding:6px 12px">← Back to Menu</button>
</div>

<div id="loanList">Loading loans...</div>

<!-- ID Modal -->
<div id="idModal" class="modal" onclick="this.classList.remove('show')">
<img id="modalImg" src="">
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { collection, getDocs, updateDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const list = document.getElementById('loanList');
const counts = document.getElementById('counts');
const modal = document.getElementById('idModal');
const modalImg = document.getElementById('modalImg');

async function loadLoans(){
  const q = query(collection(db,"loans"), orderBy("createdAt","desc"));
  const snap = await getDocs(q);
  let pending=0, approved=0, declined=0;
  let html="";
  snap.forEach(d=>{
    const data = d.data();
    const id = d.id;
    if(data.status==="PENDING") pending++;
    if(data.status==="APPROVED") approved++;
    if(data.status==="DECLINED") declined++;

    // check both old url and new base64
    const hasID = data.idImageBase64 || data.idImageUrl;
    const sizeKB = data.idImageBase64 ? (data.idImageBase64.length * 0.75 / 1024).toFixed(0)+"KB" : "External URL";

    html+=`
    <div class="card ${data.status}">
      <b>${data.fullName || 'No Name'}</b> - <span style="color:${data.status==='PENDING'?'orange':data.status==='APPROVED'?'green':'red'}">${data.status}</span>
      <div class="grid">
        <div><b>Address:</b> ${data.address||''}</div>
        <div><b>Contact:</b> ${data.contact||''}</div>
        <div><b>Amount:</b> ₱${data.amount||0}</div>
        <div><b>ID Type:</b> ${data.idType||''} (${sizeKB})</div>
        <div style="grid-column:span 2"><b>Co-Maker:</b> ${data.coMaker||''}</div>
        <div><b>Co-Maker Contact:</b> ${data.coMakerContact||'N/A'}</div>
        <div><b>Co-Maker Address:</b> ${data.coMakerAddress||'N/A'}</div>
      </div>
      <div style="font-size:11px;color:#666">ID: ${id} | ${data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString() : ''}</div>
      ${hasID ? `<button class="btn btn-view" onclick="viewID('${id}')">👁️ VIEW UMID/SSS ID (${sizeKB})</button>` : `<div style="color:red">No ID Uploaded</div>`}
      ${data.status==='PENDING' ? `
        <div style="margin-top:10px">
          <button class="btn btn-approve" onclick="updateStatus('${id}','APPROVED')">✓ APPROVE</button>
          <button class="btn btn-decline" onclick="updateStatus('${id}','DECLINED')">X DECLINE</button>
        </div>` : ``}
    </div>`;
  });
  list.innerHTML = html || "Wala pang loans";
  counts.textContent = `PENDING: ${pending} | APPROVED: ${approved} | DECLINED: ${declined} | TOTAL: ${snap.size}`;
  window._loansCache = snap;
}

window.viewID = async (loanId)=>{
  const snap = window._loansCache;
  let imgSrc="";
  snap.forEach(d=>{ if(d.id===loanId){ imgSrc = d.data().idImageBase64 || d.data().idImageUrl || ""; } });
  if(!imgSrc){ alert("No ID found"); return; }
  modalImg.src = imgSrc;
  modal.classList.add('show');
}

window.updateStatus = async (id, newStatus)=>{
  if(!confirm(`I-${newStatus} mo ba loan na to?`)) return;
  await updateDoc(doc(db,"loans",id),{status:newStatus});
  alert(`Loan ${newStatus}!`);
  loadLoans();
}

loadLoans();
</script>
</body>
</html>
