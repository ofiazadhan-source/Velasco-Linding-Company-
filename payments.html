<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments - LINDING COOP</title>
<style>
*{box-sizing:border-box;font-family:Segoe UI,Arial}body{margin:0;background:#f2f2f2}
.top{background:#1976d2;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.wrap{max-width:600px;margin:0 auto;padding:10px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 10px rgba(0,0,0,.06);border-left:5px solid #1976d2}
.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:bold;color:#fff;background:#2e7d32}
.row{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}
.progress{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin:8px 0}
.bar{height:100%;background:#1976d2}
.btn{padding:11px;border:none;border-radius:10px;font-weight:bold;width:100%;margin-top:8px}
.btn-pay{background:#1976d2;color:#fff}.btn-history{background:#eee}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:100;padding:12px}
.modal-box{background:#fff;padding:16px;border-radius:16px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:6px}
</style>
</head>
<body>
<div class="top"><span onclick="location.href='index.html'" style="font-size:20px">⬅️</span><b>Payments & Collection</b></div>
<div class="wrap">
<div id="list">Loading APPROVED loans...</div>
</div>

<!-- PAY MODAL -->
<div id="payModal" class="modal"><div class="modal-box">
<b id="payName"></b><br><small id="payInfo"></small>
<div class="input" style="background:#f5f5f5;margin-top:10px"><b>Balance:</b> ₱<span id="payBalance">0</span><br><b>Weekly:</b> ₱<span id="payWeekly">0</span></div>
<label style="font-size:12px;font-weight:bold;margin-top:10px;display:block">Amount Paid Today</label>
<input id="payAmount" type="number" class="input" placeholder="ex: 1000">
<label style="font-size:12px;font-weight:bold;margin-top:8px;display:block">Note (Week 1, Week 2, etc)</label>
<input id="payNote" class="input" placeholder="Week 1 payment">
<button class="btn btn-pay" onclick="confirmPay()">✅ Confirm Payment</button>
<button class="btn btn-history" onclick="document.getElementById('payModal').style.display='none'">Cancel</button>
</div></div>

<!-- HISTORY MODAL -->
<div id="histModal" class="modal" onclick="if(event.target==this)this.style.display='none'"><div class="modal-box">
<b>Payment History</b><div id="histList" style="margin-top:10px;font-size:13px"></div>
<button class="btn btn-history" onclick="document.getElementById('histModal').style.display='none'">Close</button>
</div></div>

<script type="module">
import { db } from "./firebase-config.js";
import { collection, onSnapshot, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let loans=[];
let currentId=null;

onSnapshot(collection(db,"loans"), snap=>{
  loans=[];
  snap.forEach(d=>{
    let data=d.data();
    if(data.status=="APPROVED") loans.push({id:d.id, ...data});
  });
  loans.sort((a,b)=> (b.approvedAt?.seconds||0) - (a.approvedAt?.seconds||0));
  render();
});

function render(){
  if(loans.length==0){ document.getElementById('list').innerHTML="<p style='text-align:center;color:#888;margin-top:30px'>Wala pang APPROVED. Mag-APPROVE ka muna sa Manage Loans.</p>"; return; }
  let html="";
  loans.forEach(l=>{
    let paid = l.paidAmount || 0;
    let total = l.total || l.amount || 0;
    let remaining = total - paid;
    let percent = total>0 ? (paid/total)*100 : 0;
    let weekly = l.weekly || 0;
    html+=`
    <div class="card">
      <div style="display:flex;justify-content:space-between"><b>${l.name||'No Name'}</b><span class="badge">APPROVED</span></div>
      <div class="row"><span>Contact:</span><span>${l.contact||''}</span></div>
      <div class="row"><span>Total Loan:</span><b>₱${total}</b></div>
      <div class="row"><span>Paid:</span><span style="color:#2e7d32">₱${paid}</span></div>
      <div class="row"><span>Balance:</span><b style="color:#c62828">₱${remaining}</b></div>
      <div class="progress"><div class="bar" style="width:${percent}%"></div></div>
      <div class="row"><span>Weekly:</span><span>₱${weekly} • Due: ${l.dueDate||''}</span></div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btn-pay" style="flex:1" onclick="openPay('${l.id}')">💳 Add Payment</button>
        <button class="btn btn-history" style="flex:1" onclick="openHist('${l.id}')">📜 History</button>
      </div>
    </div>`;
  });
  document.getElementById('list').innerHTML=html;
}

window.openPay = (id)=>{
  currentId=id;
  let l=loans.find(x=>x.id==id);
  document.getElementById('payName').innerText=l.name;
  document.getElementById('payInfo').innerText=`${l.contact||''} • ${l.term||''} weeks`;
  document.getElementById('payBalance').innerText=( (l.total||0) - (l.paidAmount||0) );
  document.getElementById('payWeekly').innerText=l.weekly||0;
  document.getElementById('payAmount').value=l.weekly||'';
  document.getElementById('payNote').value='';
  document.getElementById('payModal').style.display='flex';
}

window.confirmPay = async ()=>{
  let amt=parseFloat(document.getElementById('payAmount').value);
  let note=document.getElementById('payNote').value||'Payment';
  if(!amt||amt<=0) return alert("Lagay mo amount boss");
  let l=loans.find(x=>x.id==currentId);
  let newPaid=(l.paidAmount||0)+amt;
  let newRemaining=(l.total||0)-newPaid;
  
  await updateDoc(doc(db,"loans",currentId),{
    paidAmount:newPaid,
    remainingBalance:newRemaining,
    payments: arrayUnion({amount:amt, note:note, date:new Date().toLocaleString(), timestamp:Date.now()}),
    status: newRemaining<=0 ? "PAID" : "APPROVED"
  });
  document.getElementById('payModal').style.display='none';
  alert(`Payment recorded! Balance na lang: ₱${newRemaining}`);
}

window.openHist = (id)=>{
  let l=loans.find(x=>x.id==id);
  let hist=l.payments||[];
  if(hist.length==0){ document.getElementById('histList').innerHTML="<small style='color:#888'>Wala pang payment</small>"; }
  else{
    hist.sort((a,b)=>b.timestamp-a.timestamp);
    document.getElementById('histList').innerHTML=hist.map(h=>`
      <div style="background:#f5f5f5;padding:8px;border-radius:8px;margin-bottom:6px">
        <b>₱${h.amount}</b> - ${h.note}<br><small style="color:#888">${h.date}</small>
      </div>
    `).join('');
  }
  document.getElementById('histModal').style.display='flex';
}
</script>
</body>
  </html>
