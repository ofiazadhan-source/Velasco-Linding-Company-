<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINDING COOP - Apply</title>
<style>body{font-family:Arial;padding:15px;background:#f5f5f5}input,select,button{width:100%;padding:12px;margin:6px 0}button{background:green;color:white;border:none;border-radius:8px;font-weight:bold}</style>
</head><body>
<h2>LINDING COOP Loan Apply</h2>
<form id="loanForm">
<input id="fullName" placeholder="Full Name" required>
<input id="address" placeholder="Address" required>
<input id="contact" placeholder="Contact No." required>
<input id="coMaker" placeholder="Co-Maker Name" required>
<input id="coMakerContact" placeholder="Co-Maker Contact No." required>
<input id="coMakerAddress" placeholder="Co-Maker Address" required>
<select id="idType" required><option value="">Select ID Type</option><option>UMID</option><option>SSS</option><option>National ID</option><option>Driver's License</option></select>
<label>Upload ID (Auto Compress to Smallest):</label>
<input type="file" id="idFile" accept="image/*" required>
<img id="preview" style="width:100%;max-width:300px;display:none;border:1px solid #ccc;margin-top:10px">
<p id="sizeInfo"></p>
<input id="amount" type="number" placeholder="Loan Amount" required>
<button type="submit" id="submitBtn">SUBMIT APPLICATION</button>
</form>
<script type="module">
import { db } from "./firebase-config.js";
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let compressedBase64 = "";
const fileInput = document.getElementById('idFile');
const preview = document.getElementById('preview');
const sizeInfo = document.getElementById('sizeInfo');

fileInput.addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const originalKB = (file.size/1024).toFixed(0);
  sizeInfo.textContent = `Original: ${originalKB}KB - Compressing...`;
  compressedBase64 = await compressImage(file);
  const newKB = (compressedBase64.length * 0.75 / 1024).toFixed(0);
  preview.src = compressedBase64;
  preview.style.display='block';
  sizeInfo.textContent = `Original: ${originalKB}KB → Compressed: ${newKB}KB (95% smaller!)`;
});

function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height;
        const maxSize = 500; // pinaka maliit pero malinaw pa rin
        if(width>height){ if(width>maxSize){ height*=maxSize/width; width=maxSize; } }
        else{ if(height>maxSize){ width*=maxSize/height; height=maxSize; } }
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', 0.3)); // 30% quality = pinaka maliit
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('loanForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.textContent="UPLOADING..."; btn.disabled=true;
  try{
    await addDoc(collection(db,"loans"),{
      fullName: fullName.value,
      address: address.value,
      contact: contact.value,
      coMaker: coMaker.value,
      coMakerContact: document.getElementById('coMakerContact').value,
      coMakerAddress: document.getElementById('coMakerAddress').value,
      idType: idType.value,
      idImageBase64: compressedBase64, // naka-compress na!
      amount: Number(amount.value),
      status: "PENDING",
      createdAt: serverTimestamp()
    });
    alert("SUCCESS! Na-compress at na-save na!");
    window.location.href="status.html?name="+encodeURIComponent(fullName.value);
  }catch(err){ alert("Error: "+err.message); btn.textContent="SUBMIT"; btn.disabled=false; }
});
</script></body></html>
