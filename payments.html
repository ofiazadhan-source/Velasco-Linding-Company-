<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINDING COOP - Payments 5% Monthly</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f5f5f5;padding:12px}
.header{background:#15803d;color:white;padding:15px;border-radius:12px}
.card{background:white;padding:15px;border-radius:12px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
button{background:#15803d;color:white;font-weight:bold;border:none;cursor:pointer}
.row{display:flex;gap:8px}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;color:white;display:inline-block}
.list-item{border-bottom:1px solid #eee;padding:12px 0;font-size:13px;line-height:1.5}
.total{font-size:22px;font-weight:bold;color:#15803d}
.profit{background:#fef9c3;padding:3px 8px;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<b style="font-size:20px">💳 Payments - 5% Monthly</b><br>
<small>5% x Months | Service Fee ₱200 | May Kita Na!</small><br>
<button onclick="location.href='index.html'" style="background:white;color:#15803d;width:auto;padding:6px 14px;margin-top:8px">← Back</button>
</div>

<div class="card">
<h3 style="margin:0 0 8px 0">Add Payment</h3>
<select id="loanSelect"><option>Loading APPROVED loans...</option></select>
<div id="loanInfo" style="background:#fff7ed;padding:10px;border-radius:8px;margin:6px 0;font-size:13px;display:none"></div>
<input id="payAmount" type="number" placeholder="Amount Paid (e.g. 3900)">
<input id="payDate" type="date">
<select id="payType"><option>Monthly Payment</option><option>Weekly Payment</option><option>Partial Payment</option><option>Full Payment</option></select>
<input id="collector" placeholder="Collector Name e.g. Rose">
<button onclick="addPayment()" id="payBtn">💾 SAVE PAYMENT</button>
</div>

<div class="row">
<div class="card" style="flex:1;text-align:center"><small>Collected Today</small><div class="total" id="todayTotal">₱0</div></div>
<div class="card" style="flex:1;text-align:center"><small>All Payments</small><div class="total" id="allTotal">₱0</div></div>
<div class="card" style="flex:1;text-align:center"><small>Kita ng COOP</small><div class="total" style="color:orange" id="profitTotal">₱0</div></div>
</div>

<div class="card">
<h3>Payment History</h3>
<div id="payList">Loading...</div>
</div>

<div class="card">
<h3>Outstanding Balance (with 5% x Months)</h3>
<div id="balanceList">Loading...</div>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { collection, getDocs, addDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let approvedLoans = {};

function computeLoan(loan){
  const amt = Number(loan.amount||0);
  const months = Number(loan.months||3);
  const rate = Number(loan.interestRate||months*5);
  const interest = Number(loan.interestAmount?? amt*rate/100);
  const fee = Number(loan.serviceFee||200);
  const totalDue = Number(loan.totalDue?? amt+interest+fee);
  const monthly = Number(loan.monthlyPayment || Math.ceil(totalDue/months));
  const profit = interest+fee;
  return {amt, months, rate, interest, fee, totalDue, monthly, profit};
}

async function loadApproved(){
  const snap = await getDocs(query(collection(db,"loans"), where("status","==","APPROVED")));
  const sel = document.getElementById('loanSelect');
  let html = `<option value="">-- Piliin Member (APPROVED) --</option>`;
  snap.forEach(d=>{
    const data = d.data(); approvedLoans[d.id]=data;
    const c = computeLoan(data);
    html += `<option value="${d.id}">${data.fullName} - Loan ₱${c.amt} - ${c.months}mo - Total ₱${c.totalDue} - Monthly ₱${c.monthly}</option>`;
  });
  sel.innerHTML = html;
  if(snap.empty) sel.innerHTML = `<option>Wala pang APPROVED</option>`;
  sel.onchange = ()=>{
    const id = sel.value; const div = document.getElementById('loanInfo');
    if(!id){ div.style.display='none'; return; }
    const loan = approvedLoans[id]; const c = computeLoan(loan);
    div.style.display='block';
    div.innerHTML=`<b>${loan.fullName}</b><br>
    Loan: ₱${c.amt} | ${c.months} months x 5% = ${c.rate}%<br>
    Interest: ₱${c.interest} + Fee ₱${c.fee}<br>
    <b style="color:green">Total Singilin: ₱${c.totalDue}</b> | Monthly: ₱${c.monthly}<br>
    <span class="profit">Kita: ₱${c.profit}</span>`;
    document.getElementById('payAmount').value = c.monthly;
  };
  loadBalances(); loadPayments();
}

async function loadPayments(){
  const snap = await getDocs(query(collection(db,"payments"), orderBy("createdAt","desc")));
  let html=""; let today=0, all=0; const todayStr = new Date().toISOString().split('T')[0];
  snap.forEach(d=>{
    const p=d.data(); all+=Number(p.amount||0); if(p.date===todayStr) today+=Number(p.amount||0);
    const loan = approvedLoans[p.loanId] || {fullName: 'Deleted Loan'};
    html+=`<div class="list-item"><b>${loan.fullName}</b> - ₱${p.amount} <span class="badge" style="background:${p.type==='Full Payment'?'#16a34a':'#f59e0b'}">${p.type}</span><br><small>${p.date} | Collector: ${p.collector} | Loan: ${p.loanId.substring(0,6)}...</small></div>`;
  });
  document.getElementById('payList').innerHTML = html || "Wala pang payment";
  document.getElementById('todayTotal').textContent="₱"+today;
  document.getElementById('allTotal').textContent="₱"+all;
}

async function loadBalances(){
  const paySnap = await getDocs(collection(db,"payments"));
  const paidMap={}; paySnap.forEach(d=>{ const p=d.data(); paidMap[p.loanId]=(paidMap[p.loanId]||0)+Number(p.amount||0); });
  let html=""; let totalProfit=0;
  for(const id in approvedLoans){
    const loan=approvedLoans[id]; const c=computeLoan(loan); totalProfit+=c.profit;
    const paid=paidMap[id]||0; const balance=c.totalDue-paid; const monthsPaid=(paid/c.monthly).toFixed(1);
    if(balance<=-1) continue; // hide fully paid? show pa rin pero green
    html+=`<div class="list-item">
      <b>${loan.fullName}</b> - ${c.months} months @ 5%/mo<br>
      Loan ₱${c.amt} + Interest ${c.rate}% ₱${c.interest} + Fee ₱${c.fee}<br>
      <b style="color:green">Total: ₱${c.totalDue}</b> | Monthly: ₱${c.monthly}<br>
      Paid: ₱${paid} (${monthsPaid}/${c.months} mo) | <span style="color:${balance<=0?'green':'red'};font-weight:bold">Balance: ₱${balance}</span><br>
      Contact: ${loan.contact||''} | ${loan.address||''}<br>
      <span class="profit">Kita ng COOP: ₱${c.profit}</span> ${balance<=0?'<span style="color:green;font-weight:bold">✅ FULLY PAID</span>':''}
    </div>`;
  }
  document.getElementById('balanceList').innerHTML = html || "Wala pang APPROVED";
  document.getElementById('profitTotal').textContent="₱"+totalProfit;
}

window.addPayment = async ()=>{
  const loanId=document.getElementById('loanSelect').value; const amount=document.getElementById('payAmount').value;
  const date=document.getElementById('payDate').value || new Date().toISOString().split('T')[0];
  const type=document.getElementById('payType').value; const collector=document.getElementById('collector').value;
  if(!loanId){ alert("Piliin mo member!"); return; } if(!amount){ alert("Lagay mo amount!"); return; }
  const btn=document.getElementById('payBtn'); btn.textContent="SAVING..."; btn.disabled=true;
  try{
    await addDoc(collection(db,"payments"),{loanId, amount:Number(amount), date, type, collector, createdAt:serverTimestamp()});
    alert("Saved! ₱"+amount); document.getElementById('payAmount').value=""; loadPayments(); loadBalances();
  }catch(e){ alert(e.message); }
  btn.textContent="💾 SAVE PAYMENT"; btn.disabled=false;
}
document.getElementById('payDate').valueAsDate=new Date();
loadApproved();
</script>
</body>
  </html>
