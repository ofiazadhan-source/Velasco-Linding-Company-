<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINDING COOP - Payments</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f5f5f5;padding:12px}
.header{background:#15803d;color:white;padding:15px;border-radius:12px}
.card{background:white;padding:15px;border-radius:12px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
button{background:#15803d;color:white;font-weight:bold;border:none;cursor:pointer}
.row{display:flex;gap:8px}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;color:white}
.list-item{border-bottom:1px solid #eee;padding:10px 0;font-size:14px}
.total{font-size:22px;font-weight:bold;color:#15803d}
</style>
</head>
<body>
<div class="header">
<b style="font-size:20px">💳 Payments & Collection</b><br>
<small>Firebase: casino-plus-game | Weekly Singilan</small><br>
<button onclick="location.href='index.html'" style="background:white;color:#15803d;width:auto;padding:6px 14px;margin-top:8px">← Back to Menu</button>
</div>

<div class="card">
<h3 style="margin:0">Add Payment</h3>
<select id="loanSelect"><option>Loading APPROVED loans...</option></select>
<input id="payAmount" type="number" placeholder="Amount Paid (e.g. 500)">
<input id="payDate" type="date">
<select id="payType"><option>Weekly Payment</option><option>Partial Payment</option><option>Full Payment</option><option>Interest Only</option></select>
<input id="collector" placeholder="Collector Name">
<button onclick="addPayment()" id="payBtn">💾 SAVE PAYMENT</button>
</div>

<div class="row">
<div class="card" style="flex:1;text-align:center"><small>Total Collected Today</small><div class="total" id="todayTotal">₱0</div></div>
<div class="card" style="flex:1;text-align:center"><small>Total All Payments</small><div class="total" id="allTotal">₱0</div></div>
</div>

<div class="card">
<h3>Payment History</h3>
<div id="payList">Loading...</div>
</div>

<div class="card">
<h3>Outstanding Balance (APPROVED Loans)</h3>
<div id="balanceList">Loading...</div>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { collection, getDocs, addDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let approvedLoans = {};

async function loadApproved(){
  const snap = await getDocs(query(collection(db,"loans"), where("status","==","APPROVED")));
  const sel = document.getElementById('loanSelect');
  let html = `<option value="">-- Piliin ang Member (APPROVED) --</option>`;
  snap.forEach(d=>{
    const data = d.data();
    approvedLoans[d.id] = data;
    html += `<option value="${d.id}">${data.fullName} - ₱${data.amount} - ${data.contact||''}</option>`;
  });
  sel.innerHTML = html;
  if(snap.empty) sel.innerHTML = `<option>Wala pang APPROVED - Mag approve ka muna sa loans.html</option>`;
  loadBalances();
}
async function loadPayments(){
  const snap = await getDocs(query(collection(db,"payments"), orderBy("createdAt","desc")));
  let html=""; let today=0, all=0;
  const todayStr = new Date().toISOString().split('T')[0];
  snap.forEach(d=>{
    const p = d.data();
    all += Number(p.amount||0);
    if(p.date===todayStr) today += Number(p.amount||0);
    const loan = approvedLoans[p.loanId] || {fullName: p.loanId};
    html += `<div class="list-item">
      <b>${loan.fullName||'Unknown'}</b> - ₱${p.amount} <span class="badge" style="background:${p.type==='Full Payment'?'#16a34a':'#f59e0b'}">${p.type||''}</span><br>
      <small>${p.date} | Collector: ${p.collector||''} | Loan: ${p.loanId.substring(0,6)}...</small>
    </div>`;
  });
  document.getElementById('payList').innerHTML = html || "Wala pang payment";
  document.getElementById('todayTotal').textContent = "₱"+today;
  document.getElementById('allTotal').textContent = "₱"+all;
}
async function loadBalances(){
  let html="";
  const paySnap = await getDocs(collection(db,"payments"));
  const paidMap = {};
  paySnap.forEach(d=>{ const p=d.data(); paidMap[p.loanId]=(paidMap[p.loanId]||0)+Number(p.amount||0); });
  for(const id in approvedLoans){
    const loan = approvedLoans[id];
    const paid = paidMap[id]||0;
    const balance = (Number(loan.amount||0) - paid);
    html+=`<div class="list-item"><b>${loan.fullName}</b> - Loan: ₱${loan.amount} | Paid: ₱${paid} | <span style="color:${balance<=0?'green':'red'};font-weight:bold">Balance: ₱${balance}</span><br><small>${loan.address||''} | ${loan.contact||''}</small></div>`;
  }
  document.getElementById('balanceList').innerHTML = html || "Wala pang APPROVED";
}
window.addPayment = async ()=>{
  const loanId = document.getElementById('loanSelect').value;
  const amount = document.getElementById('payAmount').value;
  const date = document.getElementById('payDate').value || new Date().toISOString().split('T')[0];
  const type = document.getElementById('payType').value;
  const collector = document.getElementById('collector').value;
  if(!loanId){ alert("Piliin mo muna member!"); return; }
  if(!amount){ alert("Lagay mo amount!"); return; }
  const btn = document.getElementById('payBtn'); btn.textContent="SAVING..."; btn.disabled=true;
  try{
    await addDoc(collection(db,"payments"),{
      loanId, amount:Number(amount), date, type, collector,
      createdAt: serverTimestamp()
    });
    alert("Payment Saved! ₱"+amount);
    document.getElementById('payAmount').value="";
    loadPayments(); loadBalances();
  }catch(e){ alert(e.message); }
  btn.textContent="💾 SAVE PAYMENT"; btn.disabled=false;
}
document.getElementById('payDate').valueAsDate = new Date();
loadApproved().then(()=>loadPayments());
</script>
</body>
  </html>
