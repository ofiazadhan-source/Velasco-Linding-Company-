<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loan Status - LINDING COOP</title>
<style>
body{margin:0;background:#f5f5f5;font-family:Arial;padding:15px}
.top{background:#ff6a00;color:white;padding:20px;border-radius:15px;text-align:center}
.card{background:white;padding:20px;border-radius:20px;margin-top:15px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.badge{padding:8px 20px;border-radius:20px;font-weight:bold;display:inline-block}
.PENDING{background:#fef3c7;color:#d97706}
.APPROVED{background:#dcfce7;color:#16a34a}
.DECLINED{background:#fee2e2;color:#dc2626}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;margin-top:10px;cursor:pointer}
.btn-home{background:#eee}.btn-refresh{background:#ff6a00;color:white}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-top:10px}
</style></head><body>
<div class="top"><h1 style="margin:0">LINDING COOP</h1><small>Ulingan Lawang Bato Valenzuela</small></div>
<div class="card">
<h2 style="text-align:center;margin-top:0">Loan Application Status</h2>
<div style="text-align:center"><span id="statusBadge" class="badge PENDING">CHECKING...</span></div>
<div id="details" style="margin-top:15px;background:#fff8f0;padding:15px;border-radius:12px">Hinahanap ang loan mo...</div>
<input id="manualId" placeholder="Paste Loan ID dito kung NO ID">
<button class="btn btn-refresh" onclick="checkManual()">🔍 CHECK ID</button>
<button class="btn btn-home" onclick="location.href='index.html'">⬅️ Back to Home</button>
<button class="btn btn-refresh" onclick="location.reload()">🔄 Refresh Status</button>
<small id="loanIdText" style="display:block;text-align:center;margin-top:12px;color:#666"></small>
<small style="display:block;text-align:center;color:#666">Copy mo yang ID na yan, i-paste sa main menu para macheck ulit</small>
</div>
<script type="module">
import { db } from "./firebase-config.js";
import { doc, getDoc, collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const badge = document.getElementById('statusBadge');
const details = document.getElementById('details');
const loanIdText = document.getElementById('loanIdText');

async function loadStatus(){
  const params = new URLSearchParams(location.search);
  let loanId = params.get('id') || params.get('loanId') || params.get('loan_id') || '';
  let name = params.get('name') || '';

  loanId = loanId.trim();
  // kung may name lang galing sa lumang apply.html, hanapin by name
  if(!loanId && name){
    try{
      const q = query(collection(db,"loans"), where("fullName","==", decodeURIComponent(name)), orderBy("createdAt","desc"), limit(1));
      const snap = await getDocs(q);
      if(!snap.empty){ loanId = snap.docs[0].id; }
    }catch(e){ console.log("name search fail, trying all"); }
  }

  if(!loanId){
    badge.textContent="NO ID FOUND"; badge.className="badge DECLINED";
    details.innerHTML="Walang ID. Mag-apply ka muna. <br><br> Kung may ID ka na, i-paste mo sa taas.";
    loanIdText.textContent="Loan ID: NO ID";
    return;
  }

  loanIdText.textContent="Loan ID: "+loanId;
  document.getElementById('manualId').value=loanId;

  try{
    const d = await getDoc(doc(db,"loans",loanId));
    if(!d.exists()){ badge.textContent="NOT FOUND"; details.innerHTML="Hindi makita ang Loan ID: "+loanId; return; }
    const data = d.data();
    badge.textContent=data.status; badge.className="badge "+data.status;
    details.innerHTML=`
      <b>Name:</b> ${data.fullName}<br>
      <b>Amount:</b> ₱${data.amount}<br>
      <b>Status:</b> ${data.status}<br>
      <b>Co-Maker:</b> ${data.coMaker} (${data.coMakerContact})<br>
      <b>Address:</b> ${data.address}<br>
      <b>Co-Maker Address:</b> ${data.coMakerAddress||'N/A'}<br>
      <b>ID Type:</b> ${data.idType}<br>
      <b>Date:</b> ${data.createdAt?.toDate? data.createdAt.toDate().toLocaleString() : 'just now'}
      ${data.status==='PENDING'? '<br><br>⏳ Wait lang boss, nirereview pa ni Admin.' : ''}
      ${data.status==='APPROVED'? '<br><br>✅ Congrats! Approved na! Puntahan na sa LINDING COOP.' : ''}
      ${data.status==='DECLINED'? '<br><br>❌ Declined. Contact admin.' : ''}
    `;
  }catch(err){
    badge.textContent="ERROR"; details.innerHTML="Error: "+err.message;
  }
}
window.checkManual = ()=>{
  const id = document.getElementById('manualId').value.trim();
  if(id) location.href="status.html?id="+id;
}
loadStatus();
</script></body></html>
